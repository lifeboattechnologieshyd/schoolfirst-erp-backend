name: Development

on:
  push:
    branches:
      - development
    paths-ignore:
      - "postman/**"
      - "docs/**"
      - "bruno/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEVELOPMENT_EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add known hosts
        run: ssh-keyscan -H ${{ secrets.DEVELOPMENT_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Execute script on EC2
        run: |
          ssh ${{ secrets.DEVELOPMENT_EC2_USER }}@${{ secrets.DEVELOPMENT_EC2_HOST }} << EOF
          # Commands to run on the EC2 instance
          cd schoolfirst_erp_backend
          git checkout development
          git pull
#          docker network create samsr-network || true
          # Explicitly start ONLY deployment-required services (ignores profiled minio/qdrant)
          docker compose -f ./deploy/compose/docker-compose.yaml up -d --build --remove-orphans postgres backend
          # Clean up old/dangling images to save space without breaking cache
          docker image prune -f
          EOF
