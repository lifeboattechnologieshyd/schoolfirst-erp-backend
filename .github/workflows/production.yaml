
name: Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - "postman/**"
      - "docs/**"
      - "bruno/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add known hosts
        run: |
          ssh-keyscan -H ${{ secrets.PRODUCTION_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Production EC2
        run: |
          ssh ${{ secrets.PRODUCTION_EC2_USER }}@${{ secrets.PRODUCTION_EC2_HOST }} << 'EOF'
            set -e

            cd ~/schoolfirst-erp-backend

            # Update production code
            git fetch origin
            git checkout main
            git pull --ff-only origin main

            # Build production Docker image
            docker buildx build \
              --platform linux/arm64 \
              -t schoolfirst-erp-backend:main-latest \
              --load .

            # Stop and remove existing ERP backend container
            docker stop schoolfirst-erp-backend || true
            docker rm schoolfirst-erp-backend || true

            # Start updated ERP backend
            docker run -d \
              --name schoolfirst-erp-backend \
              --restart always \
              --env-file .env \
              -p 8000:8000 \
              schoolfirst-erp-backend:main-latest

            # Remove dangling images
            docker image prune -f

          EOF
