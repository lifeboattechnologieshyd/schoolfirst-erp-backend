name: Sync Bruno Collection

on:
  push:
    branches:
      - development
    paths:
      - "bruno/**"
      - ".github/workflows/sync-bruno.yaml"

concurrency:
  group: sync-bruno-development
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BRUNO_SYNC_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

#      - name: Push bruno folder to target repo
        run: |
          set -euo pipefail

#          git remote add bruno-target git@github.com:vetostudiospvtltd/schoolfirst-api-collection.git
          split_sha="$(git subtree split --prefix=bruno)"

          if ! git push bruno-target "$split_sha":development; then
            echo "::error::Bruno sync push was not a fast-forward. schoolfirst-api-collection/development is expected to be sync-owned; frontend consumers should only use git pull from that repository." >&2
            exit 1
          fi
