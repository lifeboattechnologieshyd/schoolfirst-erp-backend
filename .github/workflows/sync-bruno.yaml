name: Bruno Collection Check

on:
  push:
    branches:
      - development
    paths:
      - "bruno/**"

jobs:
  bruno-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Bruno folder exists
        run: |
          echo "Bruno collection detected successfully"
          ls -la bruno
