[project]
name = "schoolfirst-backend"
version = "1.0.0"
description = "A backend service for Samsr application"
requires-python = ">=3.14"


# Ruff general configuration
[tool.ruff]
exclude = [
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "**/migrations/*",
]

# Same as Black.
line-length = 120
indent-width = 4


[tool.ruff.format]
docstring-code-format = true

# Use double quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

# Respect magic trailing commas.
skip-magic-trailing-comma = false

# Automatically detect the appropriate line ending.
line-ending = "auto"


[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = [
    "A",
    "B",
    "C4",
    "C9",
    "DJ",
    "E",
    "F",
    "FURB",
    "I",
    "N",
    "PL",
    "RUF005",
    "RUF013",
    "RUF015",
    "RUF019",
    "S",
    "SIM",
    "T2",
    "TRY201",
    "TRY400",
    "UP",
    "W",
]
ignore = [
    "C901", # McCabe complexity
    "DJ001", # Django CharField/TextField null=True
    # "E501",  # line too long (handled by Black)
    "E722", # do not use bare except
    "E731",
    "PLR0911", # Too many return statements — common in view methods
    # "F601", # dictionary key repeated (can be useful in some cases)
    # "UP007", # Remove unnecessary list()/dict()/set()
    # "UP032", # Use f-strings instead of str.format
]


# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


# Ruff import sorting (replaces isort)
[tool.ruff.lint.isort]
combine-as-imports = true
detect-same-package = true
force-wrap-aliases = true
known-first-party = ["apps"]
known-third-party = ["rest_framework"]
relative-imports-order = "closest-to-furthest"


[tool.ruff.lint.pep8-naming]
# Allow lowercase variables like "id"
classmethod-decorators = ["classmethod", "validator", "root_validator"]

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules for tests
"tests/*" = ["E402", "F401", "F811"]
# Ignore imported but unused in __init__.py files
"__init__.py" = ["F401"]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true
max-doc-length = 88

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8
max-statements = 50

[tool.bandit]
skips = [
    "B101", # assert_used
    "B104", # hardcoded_bind_all_interfaces
]
targets = ["apps"] # Your source folders
exclude = ["tests/*"] # Exclude if needed
