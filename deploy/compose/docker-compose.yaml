services:
  minio:
    image: minio/minio:latest
    container_name: schoolfirst-erp-minio
    restart: always
    env_file:
      - ../../.env.docker
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_REGION_NAME: ${MINIO_REGION_NAME:-ap-south-1}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_S3_PORT:-9000}:9000" # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # MinIO Console
    volumes:
      - minio_data:/data
    networks:
      - schoolfirst-erp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: schoolfirst-erp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/schoolfirst-erp || true;
      mc anonymous set download local/schoolfirst-erp;
      exit 0;
      "
    networks:
      - schoolfirst-erp-network

  postgres:
    image: postgres:17
    container_name: schoolfirst-erp-postgres
    restart: unless-stopped
    env_file:
      - ../../.env.docker
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-schoolfirst-erp}
      - PGSSLMODE=${PGSSLMODE:-disable}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - schoolfirst-erp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: schoolfirst-erp-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_HTTP_PORT:-8025}:8025" # Web UI
    volumes:
      - mailpit_data:/data
    networks:
      - schoolfirst-erp-network

  backend:
    image: schoolfirst-erp-backend:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      tags:
        - schoolfirst-erp-backend:latest
    container_name: schoolfirst-erp-backend
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB_HOST: postgres
      POSTGRES_DB_PORT: 5432
      POSTGRES_DB_NAME: ${POSTGRES_DB:-schoolfirst-erp}
      POSTGRES_DB_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB_SSL_ENABLED: "False"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:

      - ../../logs:/logs
    ports:
      - "${HTTP_PORT:-8000}:8000"
    networks:
      - schoolfirst-erp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/').read()"]
      interval: 10s
      timeout: 5s
      retries: 5


  loki:
    image: grafana/loki:3.5.3
    container_name: schoolfirst-erp-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ../observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - schoolfirst-erp-network

  grafana:
    image: grafana/grafana:12.0.2
    container_name: schoolfirst-erp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started
    networks:
      - schoolfirst-erp-network

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: schoolfirst-erp-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/alloy.river
    volumes:
      - ../observability/alloy.river:/etc/alloy/alloy.river:ro
      - ../../logs:/logs:ro
    depends_on:
      loki:
        condition: service_started

    networks:
      - schoolfirst-erp-network

volumes:
  pg_data:
  minio_data:
  mailpit_data:
  loki_data:
  grafana_data:

networks:
  schoolfirst-erp-network:
    external: true
