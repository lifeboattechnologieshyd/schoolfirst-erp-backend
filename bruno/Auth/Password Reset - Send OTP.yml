info:
  name: Password Reset - Send OTP
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}api/v1/auth/password-reset/request"
  body:
    type: json
    data: |-
      {
          "email": "admin@samsr.us"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Error - Missing Email
    request:
      url: "{{base_url}}api/v1/auth/password-reset/request"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 131
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Email is required.",
            "data": null,
            "error": {
              "code": "REQUIRED",
              "message": "Email is required."
            },
            "meta": null
          }
  - name: Success
    request:
      url: "{{base_url}}api/v1/auth/password-reset/request"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "admin@samsr.us"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 122
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "If that email is registered, a reset code has been sent.",
            "data": null,
            "error": null,
            "meta": null
          }
  - name: Error - OTP Cooldown (429)
    request:
      url: "{{base_url}}api/v1/auth/password-reset/request"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "admin@samsr.us"
          }
    response:
      status: 429
      statusText: Too Many Requests
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "A reset code was already sent. Please try again in 43 seconds.",
            "data": null,
            "error": {
              "code": "OTP_COOLDOWN",
              "message": "Please try again in 43 seconds.",
              "retry_after": 43
            },
            "meta": null
          }
  - name: Error - OTP Rate Limit (429)
    request:
      url: "{{base_url}}api/v1/auth/password-reset/request"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "admin@samsr.us"
          }
    response:
      status: 429
      statusText: Too Many Requests
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Too many reset code requests. Please try again after 1 hour.",
            "data": null,
            "error": {
              "code": "OTP_RATE_LIMIT",
              "message": "Too many reset code requests. Please try again after 1 hour."
            },
            "meta": null
          }
