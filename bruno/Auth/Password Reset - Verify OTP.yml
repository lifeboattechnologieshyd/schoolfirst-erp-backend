info:
  name: Password Reset - Verify OTP
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}api/v1/auth/password-reset/verify"
  body:
    type: json
    data: |-
      {
          "email": "admin@schoolfirst.us",
          "otp": "123456"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Error - Missing Fields
    request:
      url: "{{base_url}}api/v1/auth/password-reset/verify"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: "149"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Email and OTP are required.",
            "data": null,
            "error": {
              "code": "REQUIRED",
              "message": "Email and OTP are required."
            },
            "meta": null
          }
  - name: Error - OTP Not Found
    request:
      url: "{{base_url}}api/v1/auth/password-reset/verify"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "nobody_reset@example.com",
            "otp": "000000"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: "182"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "No active reset code found for this email.",
            "data": null,
            "error": {
              "code": "INVALID_OTP",
              "message": "No active reset code found for this email."
            },
            "meta": null
          }
  - name: Error - Invalid OTP
    request:
      url: "{{base_url}}api/v1/auth/password-reset/verify"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "admin@schoolfirst.us",
            "otp": "000000"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: "146"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Invalid code. 4 attempts remaining.",
            "data": null,
            "error": {
              "code": "INVALID_OTP",
              "message": "Invalid code."
            },
            "meta": null
          }
  - name: Success - OTP Verified
    request:
      url: "{{base_url}}api/v1/auth/password-reset/verify"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "admin@schoolfirst.us",
            "otp": "<valid_otp_from_email>"
          }
