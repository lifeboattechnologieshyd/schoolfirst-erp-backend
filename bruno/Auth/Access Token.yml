examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/auth/refresh"
      method: POST
      body:
        type: json
        data: |-
          {
            "refresh_token": "<valid_refresh_token>"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 673
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Token refreshed successfully.",
            "data": {
