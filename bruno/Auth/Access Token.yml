  - name: Error - Missing Refresh Token
    request:
      url: "{{base_url}}api/v1/auth/refresh"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 147
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Refresh token is required.",
            "data": null,
            "error": {
              "code": "REQUIRED",
              "message": "Refresh token is required."
            },
            "meta": null
          }
  - name: Error - Invalid Token
    request:
      url: "{{base_url}}api/v1/auth/refresh"
      method: POST
      body:
        type: json
        data: |-
          {
            "refresh_token": "invalid.token.value"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 132
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
