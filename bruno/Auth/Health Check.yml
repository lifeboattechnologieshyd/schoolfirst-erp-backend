info:
  name: Health Check
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}health?format=json"
  params:
    - name: format
      value: json
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}health?format=json"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: vary
          value: Accept, origin
        - name: content-length
          value: 101
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
      body:
        type: json
        data: |-
          {
            "Cache(alias='default')": "OK",
            "Database(alias='default')": "OK",
            "Storage(alias='default')": "OK"
          }
