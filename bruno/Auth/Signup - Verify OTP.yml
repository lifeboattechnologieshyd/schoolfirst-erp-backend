info:
  name: Signup - Verify OTP
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}api/v1/auth/signup/email/verify"
  body:
    type: json
    data: |-
      {
        "email": "contact@karthiknarayan.dev",
        "otp": "123456",
        "invite_code": "6DILIP"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        // Parse the response
        let response = res.getBody();

        // Check if access_token exists
        if (response.success && response.data && response.data.access_token) {
            let accessToken = response.data.access_token;
            let refreshToken = response.data.access_token;
            let user_id = response.data.user.id

            // Set in collection variable
            bru.setVar("access_token", accessToken);
            bru.setVar("refresh_token", refreshToken);
            bru.setEnvVar("user_id", user_id);

            console.log("✅ Access token saved to collection variable:", accessToken);
        } else {
            console.warn("⚠️ No access token found in response.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Error - Missing Fields
    request:
      url: "{{base_url}}api/v1/auth/signup/email/verify"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: "175"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Email, OTP and invite code are required.",
