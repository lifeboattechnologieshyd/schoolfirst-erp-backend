info:
  name: Set Password
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}api/v1/auth/set-password"
  body:
    type: json
    data: |-
      {
        "password": "password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Error - Password Already Set
    request:
      url: "{{base_url}}api/v1/auth/set-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "password": "somepassword"
          }
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Password has already been set.",
            "data": null,
            "error": {
              "code": "PASSWORD_ALREADY_SET",
              "message": "Password has already been set."
            },
            "meta": null
          }
  - name: Error - Unauthorized
    request:
      url: "{{base_url}}api/v1/auth/set-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "password": "somepassword"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: "58"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "detail": "Authentication credentials were not provided."
          }
  - name: Error - Missing Password
    request:
      url: "{{base_url}}api/v1/auth/set-password"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: "137"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Password is required.",
            "data": null,
            "error": {
              "code": "REQUIRED",
              "message": "Password is required."
            },
            "meta": null
          }
  - name: Success
    request:
      url: "{{base_url}}api/v1/auth/set-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "password": "newpassword123"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: "92"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Password set successfully.",
            "data": null,
            "error": null,
            "meta": null
          }

docs: |-
  Set or change the authenticated user's password.
  Use this after signup (email verify) or after verifying a password-reset OTP.
  Requires a valid Bearer token in the Authorization header.
