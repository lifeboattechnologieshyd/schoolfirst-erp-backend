info:
  name: Email Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@schoolfirst.us",
      //   "password": "password"
        "password":"Admin@123"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        // Parse the response
        let response = res.getBody();

        // Check if access_token exists
        if (response.success && response.data && response.data.access_token) {
            let accessToken = response.data.access_token;
            let refreshToken = response.data.access_token;
            let user_id = response.data.user.id

            // Set in collection variable
            bru.setVar("access_token", accessToken);
            bru.setVar("refresh_token", refreshToken);
            bru.setEnvVar("user_id", user_id);

            console.log("✅ Access token saved to collection variable:", accessToken);
        } else {
            console.warn("⚠️ No access token found in response.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

