info:
  name: List Comments
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}api/v1/feed/{{feed_id}}/comments?page=1&page_size=10"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/feed/{{feed_id}}/comments?page=1&page_size=10"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Comments retrieved.",
            "data": [
              {
                "id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
                "comment_text": "Great post!",
                "user": {
                  "id": "7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f",
                  "first_name": "John",
                  "last_name": "Doe",
                  "profile_image": "https://samsr-dev.s3.amazonaws.com/profiles/7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f/IMG_6457_91ed166f.jpeg"
                },
                "created_at": "2026-05-24T17:30:00.000000Z"
              }
            ],
            "error": null,
            "meta": {
              "total": 1,
              "page": 1,
              "page_size": 10,
              "total_pages": 1
            }
          }
  - name: Error - Feed not accessible
    request:
      url: "{{base_url}}api/v1/feed/00000000-0000-0000-0000-000000000000/comments"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "FORBIDDEN",
              "message": "You do not have permission to perform this action.",
              "details": [
                {
                  "type": "detail",
                  "message": "Feed not accessible"
                }
              ]
            },
            "meta": null
          }

docs: List comments for a feed post (oldest first). Pagination via meta.
