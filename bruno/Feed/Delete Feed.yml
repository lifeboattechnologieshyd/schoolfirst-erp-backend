info:
  name: Delete Feed
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{base_url}}api/v1/feed/{{feed_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/feed/{{feed_id}}"
      method: DELETE
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Feed deleted successfully",
            "data": {},
            "error": null,
            "meta": null
          }
  - name: Error - Forbidden
    request:
      url: "{{base_url}}api/v1/feed/{{feed_id}}"
      method: DELETE
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "FORBIDDEN",
              "message": "You do not have permission to perform this action.",
              "details": [
                {
                  "type": "detail",
                  "message": "Only the creator can delete this post"
                }
              ]
            },
            "meta": null
          }

docs: Soft-delete a feed post. Only the creator may delete.
