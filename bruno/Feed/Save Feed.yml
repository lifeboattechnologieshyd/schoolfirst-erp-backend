info:
  name: Save Feed
  type: http
  seq: 11

http:
  method: POST
  url: "{{base_url}}api/v1/feed/{{feed_id}}/save"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Save a visible feed post. Idempotent if already saved. Returns updated feed with is_saved true.

examples:
  - name: Success - Save feed
    request:
      url: "{{base_url}}api/v1/feed/{{feed_id}}/save"
      method: POST
    response:
