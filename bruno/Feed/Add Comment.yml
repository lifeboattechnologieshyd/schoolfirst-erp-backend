info:
  name: Add Comment
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}api/v1/feed/{{feed_id}}/comments"
  body:
    type: json
    data: |-
      {
        "comment_text": "Great post!"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        try {
            let response = res.getBody();
            if (response && response.success === true) {
              bru.setEnvVar("comment_id", response.data.id);
            }
        } catch (e) {
            console.error("Error in post-request script:", e);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/feed/{{feed_id}}/comments"
      method: POST
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Comment added successfully",
            "data": {
              "id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
              "comment_text": "Great post!",
              "user": {
                "id": "7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f",
                "first_name": "John",
                "last_name": "Doe",
                "profile_image": "https://samsr-dev.s3.amazonaws.com/profiles/7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f/IMG_6457_91ed166f.jpeg"
              },
              "created_at": "2026-05-24T17:30:00.000000Z"
            },
            "error": null,
            "meta": null
          }
  - name: Error - Duplicate comment
    request:
      url: "{{base_url}}api/v1/feed/{{feed_id}}/comments"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "VALIDATION_ERROR",
              "message": "There was a validation error with your request.",
              "details": [
                {
                  "type": "field",
                  "field": "comment_text",
                  "message": "You can only comment once per post."
                }
              ]
            },
            "meta": null
          }

docs: Add a comment to a feed post (one comment per user per post).
