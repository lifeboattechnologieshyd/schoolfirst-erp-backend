info:
  name: Share Feed
  type: http
  seq: 11

http:
  method: POST
  url: "{{base_url}}api/v1/feed/{{feed_id}}/share"
  body:
    type: json
    data: |-
      {
        "platform": "whatsapp"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Log a share event. platform must be one of: whatsapp, facebook, twitter, native, copy_link, other.

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/feed/{{feed_id}}/share"
      method: POST
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Share logged successfully",
            "data": {},
            "error": null,
            "meta": null
          }
  - name: Error - Invalid platform
    request:
      url: "{{base_url}}api/v1/feed/{{feed_id}}/share"
      method: POST
      body:
        type: json
        data: |-
          {
            "platform": "invalid_platform"
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "VALIDATION_ERROR",
              "message": "There was a validation error with your request.",
              "details": [
                {
                  "type": "field",
                  "field": "platform",
                  "message": "\"invalid_platform\" is not a valid choice."
                }
              ]
            },
            "meta": null
          }
