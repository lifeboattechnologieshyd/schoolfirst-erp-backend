info:
  name: Create Feed
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}api/v1/feed"
  body:
    type: json
    data: |-
      {
        "body_text": null,
        "media_urls": [],
        "youtube_url": null,
        "external_urls": ["https://google.com"],
        "access_type": "only_me",
        "access_family_ids": [],
        "access_close_group_ids": [],
        "access_user_ids": []
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        try {
            let response = res.getBody();
            if (response && response.success === true) {
              bru.setEnvVar("feed_id", response.data.id);
            }
        } catch (e) {
            console.error("Error in post-request script:", e);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Create a feed post. body_text is required only when media_urls, youtube_url, and external_urls are all empty.
  media_urls are storage keys under feeds/ (returned as full public S3 URLs).

examples:
  - name: Success - external link only
    request:
      url: "{{base_url}}api/v1/feed"
      method: POST
      body:
        type: json
        data: |-
          {
            "body_text": null,
            "media_urls": [],
            "youtube_url": null,
            "external_urls": ["https://google.com"],
            "access_type": "only_me",
            "access_family_ids": [],
            "access_close_group_ids": [],
            "access_user_ids": []
          }
    response:
      status: 201
      statusText: Created
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Feed created successfully",
            "data": {
              "id": "f14409bc-3f55-49d7-b5aa-55350816112d",
              "body_text": null,
              "media_urls": [],
              "youtube_url": null,
              "external_urls": ["https://google.com"],
              "created_by": "7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f",
              "creator_info": {
                "id": "7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f",
                "first_name": "John",
                "last_name": "Doe",
                "profile_image": "https://samsr-dev.s3.amazonaws.com/profiles/7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f/IMG_6457_91ed166f.jpeg"
              },
              "access_type": "only_me",
              "access_family_ids": [],
              "access_close_group_ids": [],
              "access_user_ids": [],
              "reaction_count": 0,
              "comment_count": 0,
              "share_count": 0,
              "my_reaction": null,
              "is_saved": false,
              "reactions": {},
              "created_at": "2026-05-24T17:25:04.783866Z"
            },
            "error": null,
            "meta": null
          }
  - name: Error - Empty content
    request:
      url: "{{base_url}}api/v1/feed"
      method: POST
      body:
        type: json
        data: |-
          {
            "body_text": "",
            "media_urls": [],
            "youtube_url": null,
            "external_urls": null,
            "access_type": "only_me"
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "VALIDATION_ERROR",
              "message": "There was a validation error with your request.",
              "details": [
                {
                  "type": "field",
                  "field": "body_text",
                  "message": "body_text is required when media_urls, youtube_url, and external_urls are all empty."
                }
              ]
            },
            "meta": null
          }
  - name: Error - Youtube with media_urls
    request:
      url: "{{base_url}}api/v1/feed"
      method: POST
      body:
        type: json
        data: |-
          {
            "body_text": "Video",
            "media_urls": ["feeds/example/image.jpg"],
            "youtube_url": "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
            "access_type": "only_me"
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "VALIDATION_ERROR",
              "message": "There was a validation error with your request.",
              "details": [
                {
                  "type": "field",
                  "field": "media_urls",
                  "message": "media_urls must be empty for youtube posts"
                }
              ]
            },
            "meta": null
          }
