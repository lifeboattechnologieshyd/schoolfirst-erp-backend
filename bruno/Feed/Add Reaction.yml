info:
  name: Add Reaction
  type: http
  seq: 9

http:
  method: POST
  url: "{{base_url}}api/v1/feed/{{feed_id}}/react"
  body:
    type: json
    data: |-
      {
        "reaction": "love"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success - Add reaction
    request:
      url: "{{base_url}}api/v1/feed/{{feed_id}}/react"
      method: POST
      body:
        type: json
        data: |-
          {
            "reaction": "like"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Reaction recorded successfully",
            "data": {
              "id": "f14409bc-3f55-49d7-b5aa-55350816112d",
              "body_text": null,
              "media_urls": [],
              "youtube_url": null,
              "external_urls": ["https://google.com"],
              "created_by": "7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f",
              "creator_info": {
                "id": "7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f",
                "first_name": "John",
                "last_name": "Doe",
                "profile_image": "https://samsr-dev.s3.amazonaws.com/profiles/7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f/IMG_6457_91ed166f.jpeg"
              },
              "access_type": "only_me",
              "access_family_ids": [],
              "access_close_group_ids": [],
              "access_user_ids": [],
              "reaction_count": 1,
              "comment_count": 0,
              "share_count": 0,
              "my_reaction": "like",
              "is_saved": false,
              "reactions": {
                "like": 1
              },
              "created_at": "2026-05-24T17:25:04.783866Z"
            },
            "error": null,
            "meta": null
          }
  - name: Error - Invalid reaction
    request:
      url: "{{base_url}}api/v1/feed/{{feed_id}}/react"
      method: POST
      body:
        type: json
        data: |-
          {
            "reaction": "INVALID"
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "VALIDATION_ERROR",
              "message": "There was a validation error with your request.",
              "details": [
                {
                  "type": "field",
                  "field": "reaction",
                  "message": "Invalid reaction type: INVALID"
                }
              ]
            },
            "meta": null
          }

docs: |
  Add or change reaction. Allowed values: like, love, laugh, wow, sad, angry, celebrate.
  Send reaction null to remove. Returns updated feed object.
