info:
  name: Get Feed
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}api/v1/feed/{{feed_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Fetch a single feed post by ID (same shape as list items).

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/feed/{{feed_id}}"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Feed retrieved.",
            "data": {
              "id": "f14409bc-3f55-49d7-b5aa-55350816112d",
              "body_text": null,
              "media_urls": [
                "https://samsr-dev.s3.amazonaws.com/feeds/f14409bc-3f55-49d7-b5aa-55350816112d/photo.jpeg"
              ],
              "youtube_url": null,
              "external_urls": ["https://google.com"],
              "created_by": "7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f",
              "creator_info": {
                "id": "7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f",
                "first_name": "John",
                "last_name": "Doe",
                "profile_image": "https://samsr-dev.s3.amazonaws.com/profiles/7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f/IMG_6457_91ed166f.jpeg"
              },
              "access_type": "only_me",
              "access_family_ids": [],
              "access_close_group_ids": [],
              "access_user_ids": [],
              "reaction_count": 0,
              "comment_count": 0,
              "share_count": 0,
              "my_reaction": null,
              "is_saved": false,
              "reactions": {},
              "created_at": "2026-05-24T17:25:04.783866Z"
            },
            "error": null,
            "meta": null
          }
  - name: Error - Not found
    request:
      url: "{{base_url}}api/v1/feed/00000000-0000-0000-0000-000000000000"
      method: GET
    response:
      status: 404
      statusText: Not Found
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "NOT_FOUND",
              "message": "The requested resource was not found."
            },
            "meta": null
          }
