info:
  name: List Saved Feeds
  type: http
  seq: 13

http:
  method: GET
  url: "{{base_url}}api/v1/feed/saved?page=1&page_size=10"
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: List the current user's saved feed posts (newest save first). Only includes posts the user can still see.

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/feed/saved?page=1&page_size=10"
      method: GET
    response:
