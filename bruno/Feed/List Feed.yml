info:
  name: List Feed
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}api/v1/feed?page=1&page_size=10"
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "10"
      type: query
    - name: creator_id
      value: ""
      type: query
      description: Optional UUID — filter posts by author
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: List visible feed posts (newest first by created_at). Optional creator_id filters by author.

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/feed?page=1&page_size=10"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Feed loaded.",
            "data": [
              {
                "id": "f14409bc-3f55-49d7-b5aa-55350816112d",
                "body_text": null,
                "media_urls": [],
                "youtube_url": null,
                "external_urls": ["https://google.com"],
                "created_by": "7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f",
                "creator_info": {
                  "id": "7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f",
                  "first_name": "John",
                  "last_name": "Doe",
                  "profile_image": "https://samsr-dev.s3.amazonaws.com/profiles/7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f/IMG_6457_91ed166f.jpeg"
                },
                "access_type": "only_me",
                "access_family_ids": [],
                "access_close_group_ids": [],
                "access_user_ids": [],
                "reaction_count": 0,
                "comment_count": 0,
                "share_count": 0,
                "my_reaction": null,
                "is_saved": false,
                "reactions": {},
                "created_at": "2026-05-24T17:25:04.783866Z"
              }
            ],
            "error": null,
            "meta": {
              "total": 1,
              "page": 1,
              "page_size": 10,
              "total_pages": 1
            }
          }
  - name: Error - Invalid creator_id
    request:
      url: "{{base_url}}api/v1/feed?creator_id=not-a-uuid"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "VALIDATION_ERROR",
              "message": "There was a validation error with your request.",
              "details": [
                {
                  "type": "field",
                  "field": "creator_id",
                  "message": "Must be a valid UUID."
                }
              ]
            },
            "meta": null
          }
