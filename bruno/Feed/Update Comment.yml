info:
  name: Update Comment
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{base_url}}api/v1/feed/{{feed_id}}/comments/{{comment_id}}"
  body:
    type: json
    data: |-
      {
        "comment_text": "Updated comment text"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/feed/{{feed_id}}/comments/{{comment_id}}"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "comment_text": "Updated comment text"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Comment updated successfully",
            "data": {
              "id": "00000000-0000-0000-0000-000000000001",
              "comment_text": "Updated comment text",
              "user": {
                "id": "7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f",
                "first_name": "John",
                "last_name": "Doe",
                "profile_image": "https://samsr-dev.s3.amazonaws.com/profiles/7ba4f4e8-7b1c-4ce2-8569-7b832d07dd8f/avatar.jpeg"
              },
              "created_at": "2026-05-24T17:25:04.783866Z"
            },
            "error": null,
            "meta": null
          }
  - name: Error - Forbidden
    request:
      url: "{{base_url}}api/v1/feed/{{feed_id}}/comments/{{comment_id}}"
      method: PATCH
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "FORBIDDEN",
              "message": "You do not have permission to perform this action.",
              "details": [
                {
                  "type": "detail",
                  "message": "You can only update your own comment"
                }
              ]
            },
            "meta": null
          }

docs: Update a comment on a feed post. Only the comment author may update.
