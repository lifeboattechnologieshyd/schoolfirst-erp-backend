info:
  name: Create Generic Invite Code
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}api/v1/auth/invitations/create"
  body:
    type: json
    data: |-
      {
          "code_type": "generic",
          "max_uses": 10,
          "expires_in_days": 30
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Create a generic invitation code that can be used by anyone. Requires authentication.

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/auth/invitations/create"
      method: POST
      body:
        type: json
        data: |-
          {
            "code_type": "generic"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 353
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Invitation code created successfully",
            "data": {
              "id": "9322c0a7-1196-44d0-b555-b6c5bdf0e634",
              "code": "T8ULSS",
              "code_type": "generic",
              "target_email": null,
              "max_uses": 1,
              "current_uses": 0,
              "remaining_uses": 1,
              "expires_at": "2026-06-11T03:17:58.865950Z",
              "is_active": true,
              "created_at": "2026-05-12T03:17:58.866329Z"
            },
            "error": null,
            "meta": null
          }
  - name: Error - Unauthorized
    request:
      url: "{{base_url}}api/v1/auth/invitations/create"
      method: POST
      body:
        type: json
        data: |-
          {
            "code_type": "generic"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 58
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "detail": "Authentication credentials were not provided."
          }
