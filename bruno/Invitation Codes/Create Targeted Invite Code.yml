info:
  name: Create Targeted Invite Code
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}api/v1/auth/invitations/create"
  body:
    type: json
    data: |-
      {
          "code_type": "targeted",
          "target_email": "newuser@example.com",
          "max_uses": 1,
          "expires_in_days": 7
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Create a targeted invitation code for a specific email address. Requires authentication.

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/auth/invitations/create"
      method: POST
      body:
        type: json
        data: |-
          {
            "code_type": "targeted",
            "target_email": "specificuser@example.com"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 384
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Invitation code created successfully",
            "data": {
              "id": "834c11b9-a87d-4dd1-a69d-24b6b8d20084",
              "code": "OF14ZS",
              "code_type": "targeted",
              "target_email": "targeted_invite_test@example.com",
              "max_uses": 1,
              "current_uses": 0,
              "remaining_uses": 1,
              "expires_at": "2026-06-11T03:17:59.210364Z",
              "is_active": true,
              "created_at": "2026-05-12T03:17:59.210750Z"
            },
            "error": null,
            "meta": null
          }
  - name: Error - Unauthorized
    request:
      url: "{{base_url}}api/v1/auth/invitations/create"
      method: POST
      body:
        type: json
        data: |-
          {
            "code_type": "targeted",
            "target_email": "someone@example.com"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 58
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "detail": "Authentication credentials were not provided."
          }
