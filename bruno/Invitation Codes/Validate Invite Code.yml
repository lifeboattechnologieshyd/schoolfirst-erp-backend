info:
  name: Validate Invite Code
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}api/v1/auth/signup/invite/validate"
  body:
    type: json
    data: |-
      {
          "invite_code": "{{invite_code}}",
          "email": "brother@example.com"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Validate an invitation code before signup. Email required for targeted invites. No authentication needed.

examples:
  - name: Error - Missing Code
    request:
      url: "{{base_url}}api/v1/auth/signup/invite/validate"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 143
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Invite code is required.",
            "data": null,
            "error": {
              "code": "REQUIRED",
              "message": "Invite code is required."
            },
            "meta": null
          }
  - name: Error - Invalid Code
    request:
      url: "{{base_url}}api/v1/auth/signup/invite/validate"
      method: POST
      body:
        type: json
        data: |-
          {
            "invite_code": "FAKEXXX"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 140
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Invalid invitation code",
            "data": null,
            "error": {
              "code": "INVALID",
              "message": "Invalid invitation code"
            },
            "meta": null
          }
  - name: Success - Generic Code
    request:
      url: "{{base_url}}api/v1/auth/signup/invite/validate"
      method: POST
      body:
        type: json
        data: |-
          {
            "invite_code": "T8ULSS"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 128
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Invitation code is valid",
            "data": {
              "code_type": "generic",
              "remaining_uses": 1
            },
            "error": null,
            "meta": null
          }
  - name: Error - Email Mismatch
    request:
      url: "{{base_url}}api/v1/auth/signup/invite/validate"
      method: POST
      body:
        type: json
        data: |-
          {
            "invite_code": "OF14ZS",
            "email": "wrong@example.com"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 206
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "This invitation code is not valid for your email address",
            "data": null,
            "error": {
              "code": "INVALID",
              "message": "This invitation code is not valid for your email address"
            },
            "meta": null
          }
