info:
  name: List Invite Codes (Include Inactive)
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}api/v1/auth/invitations/list?include_inactive=true"
  params:
    - name: include_inactive
      value: "true"
      type: query
      description: Include inactive/expired codes
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: List all invitation codes including inactive ones.

