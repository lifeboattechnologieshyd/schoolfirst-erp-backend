info:
  name: Get Invite Code Users
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}api/v1/auth/invitations/{{invite_code}}/users"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Get list of users who signed up using this invitation code. Only creator can view.

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/auth/invitations/{{invite_code}}/users"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, HEAD, OPTIONS
        - name: content-length
          value: 109
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": {
              "invite_code": "T8ULSS",
              "users": [],
              "total": 0
            },
            "error": null,
            "meta": null
          }
  - name: Error - Not Found
    request:
      url: "{{base_url}}api/v1/auth/invitations/{{invite_code}}/users"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, HEAD, OPTIONS
        - name: content-length
          value: 146
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Invitation code not found",
            "data": null,
            "error": {
              "code": "NOT_FOUND",
              "message": "Invitation code not found"
            },
            "meta": null
          }
  - name: Error - Unauthorized
    request:
      url: "{{base_url}}api/v1/auth/invitations/{{invite_code}}/users"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, HEAD, OPTIONS
        - name: content-length
          value: 58
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "detail": "Authentication credentials were not provided."
          }
