info:
  name: Create Temporary Share
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}api/v1/docusafe/shares"
  body:
    type: json
    data: |-
      {
        "file_ids": [
          "{{file_id}}"
        ],
        "title": "My documents temporary share",
        "password": "secure123",
        "expires_at": "2026-12-31T23:59:59Z",
        "max_views": 10,
        "recipient_emails": [
          "karthik@gmail.com",
          "abhinay@gmail.com"
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        try {
            let response = res.getBody();

            // Check if token is expired
            if (response && response.success === true) {
              console.log("Updating Temporary Share ID Variable");
              var share_id = response.data.id;
              bru.setEnvVar("share_id", share_id);
            }
        } catch (e) {
            console.error("❌ Error in collection-level post-request script:", e);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Error - Missing Fields
    request:
      url: "{{base_url}}api/v1/docusafe/shares"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, POST, HEAD, OPTIONS
        - name: content-length
          value: 421
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "VALIDATION_ERROR",
              "message": "There was a validation error with your request.",
              "details": [
                {
                  "type": "field",
                  "field": "file_ids",
                  "issue": null,
                  "message": "This field is required."
                },
                {
                  "type": "field",
                  "field": "password",
                  "issue": null,
