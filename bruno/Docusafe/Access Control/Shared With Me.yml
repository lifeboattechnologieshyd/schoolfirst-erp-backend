info:
  name: Shared With Me
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}api/v1/docusafe/shared-with-me?page=1&page_size=20"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: List all files and folders shared with the authenticated user.

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/docusafe/shared-with-me?page=1&page_size=20"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, HEAD, OPTIONS
        - name: content-length
          value: 112
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": [],
            "error": null,
            "meta": {
              "total": 0,
              "page": 0,
              "page_size": 0,
              "total_pages": 0
            }
          }
  - name: Error - Unauthorized
    request:
      url: "{{base_url}}api/v1/docusafe/shared-with-me?page=1&page_size=20"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, HEAD, OPTIONS
        - name: content-length
          value: 58
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "detail": "Authentication credentials were not provided."
          }
