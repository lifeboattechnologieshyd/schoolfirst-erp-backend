info:
  name: Update File Details
  type: http
  seq: 1

http:
  method: PUT
  url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}/files/{{file_id}}"
  body:
    type: json
    data: |-
      {
        "id": "{{file_id}}",
        "folder_id": "02254441-bd9e-41ba-81b7-da3f752e87f6",
        "file_name": "CHANGELOG.md",
        "description": "hello",
        "remarks": null,
        "file_path": "docusafe/2eb91e69-ba97-414a-8bc5-6acb82298dee/02254441-bd9e-41ba-81b7-da3f752e87f6/7b90d85c-71af-44f6-80ba-35d2f8b50464_changelog.md",
        "mime_type": "text/markdown",
        "file_size": 1129,
        "file_extension": ".md",
        "checksum": "859c7902bed93cf83f1a0f33dcff1804f87e55f6b79503f883908fb9d233b76e",
        "is_shared": false,
        "metadata": {},
        "created_at": "2026-03-22T15:50:05.613441Z",
        "updated_at": "2026-03-22T15:50:05.613455Z"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}/files/{{file_id}}"
      method: PUT
      body:
        type: json
        data: |-
          {
            "file_name": "updated_sample.png",
            "description": "Updated description"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, PUT, PATCH, DELETE, HEAD, OPTIONS
        - name: content-length
          value: 1018
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
