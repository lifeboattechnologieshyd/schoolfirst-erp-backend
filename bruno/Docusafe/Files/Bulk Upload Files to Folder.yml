                  "file_url": "https://samsr-dev.s3.amazonaws.com/docusafe/b7dce1c0-5847-4a11-bd3e-fd094eeedc49/57993c3c-e70f-4563-a6ae-d07604fc3095/77caefa7-69b7-4814-b1ef-1282eefc0106_bulk1.png?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=AKIAYDMF43AF7JJOR6SY%2F20260512%2Fap-south-1%2Fs3%2Faws4_request&X-Amz-Date=20260512T032206Z&X-Amz-Expires=900&X-Amz-SignedHeaders=host&X-Amz-Signature=a568f5d11c019a15fbedf918d193eb8904ea3aed88911798688d408e240df95c",
