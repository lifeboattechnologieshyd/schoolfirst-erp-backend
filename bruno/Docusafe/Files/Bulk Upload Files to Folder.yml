  - name: Error - Invalid Descriptions
    request:
      url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}/files/bulk"
      method: POST
      body:
        type: json
        data: |-
          {
            "files": "<multipart>",
            "descriptions": "invalid_json"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 236
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
