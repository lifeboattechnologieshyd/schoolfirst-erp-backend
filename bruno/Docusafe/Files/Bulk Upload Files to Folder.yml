info:
  name: Bulk Upload Files to Folder
  type: http
  seq: 8

http:
  method: POST
  url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}/files/bulk"
  body:
    type: multipart-form
    data:
      - name: files
        type: file
        value:
          - /Users/karthiknarayan/veto/samsr-backend/AGENTS.md
      - name: descriptions
        type: text
        value: "{}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        try {
            let response = res.getBody();

            // Check if token is expired
            if (response && response.success === true) {
              console.log("Updating File ID Variable");
              var file_id = response.data.id;
              bru.setEnvVar("file_id", file_id);
            }
        } catch (e) {
            console.error("❌ Error in collection-level post-request script:", e);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}/files/bulk"
      method: POST
      body:
        type: json
        data: |-
          {
            "files": "<multipart>",
            "descriptions": "[{\"file_name\":\"bulk1.png\",\"description\":\"First bulk file\"}]"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 1068
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Successfully uploaded 1 files. Failed: 0 files.",
            "data": {
              "success_files": [
                {
                  "id": "77caefa7-69b7-4814-b1ef-1282eefc0106",
                  "file_name": "bulk1.png",
                  "file_size": 67,
                  "mime_type": "image/png",
                  "is_shared": false,
                  "status": "ACTIVE",
                  "llm_status": "PENDING",
                  "created_at": "2026-05-12T03:22:06.490852Z",
                  "description": "First bulk file",
                  "summary": null,
                  "embedding_model": null,
                  "folder_id": "57993c3c-e70f-4563-a6ae-d07604fc3095",
