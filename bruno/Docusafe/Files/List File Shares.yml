info:
  name: List File Shares
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}/files/{{file_id}}/shares?page=1&page_size=20"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}/files/{{file_id}}/shares?page=1&page_size=20"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, POST, HEAD, OPTIONS
        - name: content-length
          value: 308
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": [
              {
                "id": "eb73fd2d-fcab-46ee-be64-da7e18eee8c5",
                "title": "Patched Title",
                "status": "ACTIVE",
                "expires_at": "2026-12-31T23:59:59Z",
                "view_count": 0,
                "file_count": 1,
                "created_at": "2026-05-12T03:22:11.250333Z"
              }
            ],
            "error": null,
            "meta": {
              "total": 1,
              "page": 1,
              "page_size": 1,
              "total_pages": 1
            }
          }
  - name: Error - File Not Found
    request:
      url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}/files/{{file_id}}/shares?page=1&page_size=20"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, POST, HEAD, OPTIONS
        - name: content-length
          value: 135
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "NOT_FOUND",
              "message": "The requested resource was not found."
            },
            "meta": null
          }
  - name: Error - Unauthorized
    request:
      url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}/files/{{file_id}}/shares?page=1&page_size=20"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, POST, HEAD, OPTIONS
        - name: content-length
          value: 58
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "detail": "Authentication credentials were not provided."
          }
