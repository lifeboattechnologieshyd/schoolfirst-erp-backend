info:
  name: Upload File to Folder
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}/files"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - /Users/karthiknarayan/veto/samsr-backend/CHANGELOG.md
      - name: file_name
        type: text
        value: CHANGELOG.md
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        try {
            let response = res.getBody();

            // Check if token is expired
            if (response && response.success === true) {
              console.log("Updating File ID Variable");
              var file_id = response.data.id;
              bru.setEnvVar("file_id", file_id);
            }
        } catch (e) {
            console.error("❌ Error in collection-level post-request script:", e);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}/files"
      method: POST
      body:
        type: json
        data: |-
          {
            "file": "<multipart image>",
            "file_name": "sample.png",
            "description": "Sample image"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, POST, HEAD, OPTIONS
        - name: content-length
          value: 1003
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Created successfully.",
            "data": {
              "id": "56da33e7-a9a1-4e62-a3c4-9028a1a4a8e8",
