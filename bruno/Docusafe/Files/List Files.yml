info:
  name: List Files in Folder
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}/files?page=1&page_size=20"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}/files?page=1&page_size=20"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, POST, HEAD, OPTIONS
        - name: content-length
          value: 534
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": [
              {
                "id": "77caefa7-69b7-4814-b1ef-1282eefc0106",
                "file_name": "bulk1.png",
                "file_size": 67,
                "mime_type": "image/png",
                "is_shared": false,
                "status": "ACTIVE",
                "llm_status": "PENDING",
                "created_at": "2026-05-12T03:22:06.490852Z"
              },
              {
                "id": "56da33e7-a9a1-4e62-a3c4-9028a1a4a8e8",
                "file_name": "sample.png",
                "file_size": 67,
                "mime_type": "image/png",
                "is_shared": false,
                "status": "ACTIVE",
                "llm_status": "PENDING",
                "created_at": "2026-05-12T03:22:05.692665Z"
              }
            ],
            "error": null,
            "meta": {
              "total": 2,
              "page": 1,
              "page_size": 2,
              "total_pages": 1
            }
          }
  - name: Error - Folder Not Found
    request:
      url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}/files?page=1&page_size=20"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, POST, HEAD, OPTIONS
        - name: content-length
          value: 135
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "NOT_FOUND",
              "message": "The requested resource was not found."
            },
            "meta": null
          }
  - name: Error - Unauthorized
    request:
      url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}/files?page=1&page_size=20"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, POST, HEAD, OPTIONS
        - name: content-length
          value: 58
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "detail": "Authentication credentials were not provided."
          }
