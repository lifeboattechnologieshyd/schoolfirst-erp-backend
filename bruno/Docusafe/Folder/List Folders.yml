info:
  name: List Folders
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}api/v1/docusafe/folders?page=1&page_size=20"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/docusafe/folders?page=1&page_size=20"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, POST, HEAD, OPTIONS
        - name: content-length
          value: 488
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": [
              {
                "id": "7bd1d9f1-0b95-4c9a-8b6e-654a28140b20",
                "name": "Updated Folder 1778556090",
                "file_count": 0,
                "total_size": 0,
                "is_shared": false,
                "status": "ACTIVE",
                "created_at": "2026-05-12T03:21:30.255908Z"
              },
              {
                "id": "c0de0c84-c078-4830-9a1b-c5c42bd8ab98",
                "name": "Test Folder 1778552489",
                "file_count": 0,
                "total_size": 0,
                "is_shared": false,
                "status": "ACTIVE",
                "created_at": "2026-05-12T02:21:29.991128Z"
              }
            ],
            "error": null,
            "meta": {
              "total": 2,
              "page": 1,
              "page_size": 2,
              "total_pages": 1
            }
          }
  - name: Error - Unauthorized
    request:
      url: "{{base_url}}api/v1/docusafe/folders?page=1&page_size=20"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, POST, HEAD, OPTIONS
        - name: content-length
          value: 58
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "detail": "Authentication credentials were not provided."
          }
