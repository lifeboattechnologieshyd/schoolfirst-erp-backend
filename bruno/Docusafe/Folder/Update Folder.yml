info:
  name: Update Folder
  type: http
  seq: 5

http:
  method: PUT
  url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}"
  body:
    type: json
    data: |-
      {
        "id": "{{folder_id}}",
        "name": "My Documents8",
        "description": "Here i store my documents"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}"
      method: PUT
      body:
        type: json
        data: |-
          {
            "name": "Updated Name",
            "description": "Updated description"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, PUT, PATCH, DELETE, HEAD, OPTIONS
        - name: content-length
          value: 401
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Updated successfully.",
            "data": {
              "id": "57993c3c-e70f-4563-a6ae-d07604fc3095",
              "name": "Updated Folder 1778556125",
              "file_count": 0,
              "total_size": 0,
              "is_shared": false,
              "status": "ACTIVE",
              "created_at": "2026-05-12T03:22:04.757408Z",
              "description": "Updated description",
              "owner_id": "b7dce1c0-5847-4a11-bd3e-fd094eeedc49",
              "updated_at": "2026-05-12T03:22:05.309455Z"
            },
            "error": null,
            "meta": null
          }
  - name: Error - Not Found
    request:
      url: "{{base_url}}api/v1/docusafe/folders/{{folder_id}}"
      method: PUT
      body:
        type: json
        data: |-
          {
            "name": "Doesn't matter"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, PUT, PATCH, DELETE, HEAD, OPTIONS
        - name: content-length
          value: 135
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "NOT_FOUND",
              "message": "The requested resource was not found."
            },
            "meta": null
          }
