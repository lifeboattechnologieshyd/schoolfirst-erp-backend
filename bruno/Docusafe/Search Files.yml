info:
  name: Search Files
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}api/v1/docusafe/search"
  body:
    type: json
    data: |-
      {
        "query": "17-01-2026",
        "folder_id": "3f5f6dfd-18e3-4ddb-be36-75648fac3dec",
        "limit": 10
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Error - Missing Query
    request:
      url: "{{base_url}}api/v1/docusafe/search"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 37
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "query": [
              "This field is required."
            ]
          }
  - name: Success
    request:
      url: "{{base_url}}api/v1/docusafe/search"
      method: POST
      body:
        type: json
        data: |-
          {
            "query": "sample document"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 82
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Found 0 result(s).",
            "data": [],
            "error": null,
            "meta": null
          }
  - name: Error - Unauthorized
    request:
      url: "{{base_url}}api/v1/docusafe/search"
      method: POST
      body:
        type: json
        data: |-
          {
            "query": "test"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 58
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "detail": "Authentication credentials were not provided."
          }
