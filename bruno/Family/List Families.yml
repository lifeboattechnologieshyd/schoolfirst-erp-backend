info:
  name: List Families
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}api/v1/family"
  params:
    - name: page_size
      value: "1"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/family"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, POST, HEAD, OPTIONS
        - name: content-length
          value: "502"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": [
              {
                "id": "5eacaf61-d7dd-419c-9772-e6f049ad51a5",
                "name": "My New Family",
                "family_picture": null,
                "owner_name": "John",
                "member_count": 2,
                "is_owner": true,
                "created_at": "2026-05-10T05:11:41.326813Z"
              },
              {
                "id": "a5812101-0df9-4416-a5cd-48487ca24fce",
                "name": "Calendar Test Family",
                "family_picture": null,
                "owner_name": "Test User 494",
                "member_count": 2,
                "is_owner": false,
                "created_at": "2026-05-11T16:39:26.811262Z"
              }
            ],
            "error": null,
            "meta": {
              "total": 2,
              "page": 1,
              "page_size": 2,
              "total_pages": 1
            }
          }
  - name: Error - Unauthorized
    request:
      url: "{{base_url}}api/v1/family"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, POST, HEAD, OPTIONS
        - name: content-length
          value: "58"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "detail": "Authentication credentials were not provided."
          }
