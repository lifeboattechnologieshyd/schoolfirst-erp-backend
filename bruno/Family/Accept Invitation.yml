info:
  name: Accept Invitation
  type: http
  seq: 10
  description: |
    Accept a pending family invitation. The current user must have
    status=invited for the given family. Response data includes
    status=joined and family details via FamilyInvitationSerializer.
http:
  method: POST
  url: "{{base_url}}api/v1/family/{{family_id}}/accept"
  auth: inherit

examples:
  - name: Error - Not Found
    request:
      url: "{{base_url}}api/v1/family/{{family_id}}/accept"
      method: POST
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 135
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "NOT_FOUND",
              "message": "The requested resource was not found."
            },
            "meta": null
          }
  - name: Success
    request:
      url: "{{base_url}}api/v1/family/{{family_id}}/accept"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: 356
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Family invitation accepted.",
            "data": {
              "id": "fc61117e-9318-4459-a30e-9a78abd2c0c6",
              "family": "5eacaf61-d7dd-419c-9772-e6f049ad51a5",
              "family_name": "My New Family",
              "family_picture": null,
              "role": "member",
              "status": "joined",
              "relation": "friend",
              "invited_by_name": "John",
              "created_at": "2026-05-12T03:09:00.734455Z"
            },
            "error": null,
            "meta": null
          }
