info:
  name: Upload File
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}api/v1/upload"
  body:
    type: multipart-form
    data:
      - name: files
        type: file
        value:
          - /private/var/folders/tx/shmm59x976nbt6ftkpww_q8r0000gn/T/TemporaryItems/com.apple.Photos.NSItemProvider/uuid=521854F9-B25B-49B2-BDAC-3B7747EDA1E2&code=001&library=1&type=1&mode=2&loc=true&cap=true.jpeg/IMG_6457.jpeg
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{base_url}}api/v1/upload"
      method: POST
      body:
        type: json
        data: |-
          {
            "file": "<binary image file>"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: "165"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": {
              "path": "temp/b7dce1c0-5847-4a11-bd3e-fd094eeedc49/test_9d075520.png",
              "filename": "test_9d075520.png"
            },
            "error": null,
            "meta": null
          }
  - name: Error - No File Provided
    request:
      url: "{{base_url}}api/v1/upload"
      method: POST
      body:
        type: json
        data: |-
          {
            "note": "multipart/form-data with no 'file' field"
          }
    response:
      status: 415
      statusText: Unknown
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: "68"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "detail": "Unsupported media type \"application/json\" in request."
          }
  - name: Error - Unauthorized
    request:
      url: "{{base_url}}api/v1/upload"
      method: POST
      body:
        type: json
        data: |-
          {
            "file": "<binary image file>"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: POST, OPTIONS
        - name: content-length
          value: "58"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "detail": "Authentication credentials were not provided."
          }

docs: |
  Upload a file to temporary storage. Requires authentication. Files are stored in temp/{user_id}/ so each user's uploads are isolated.
  Returns the file URL and path. Pass the path (not the URL) to subsequent API calls (e.g., create family, update profile).
  The file is moved to the appropriate permanent folder by that API. Temp files older than 24 hours are cleaned up automatically.
