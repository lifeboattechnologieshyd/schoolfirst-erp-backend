      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "VALIDATION_ERROR",
              "message": "There was a validation error with your request.",
              "details": [
                {
                  "type": "field",
                  "field": "email",
                  "issue": null,
                  "message": "Cannot add yourself to your close group."
                }
              ]
