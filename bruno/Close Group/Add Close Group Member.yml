info:
  name: Add Close Group Member
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}api/v1/close-group/{{close_group_id}}/members"
  body:
    type: json
    data: |-
      {
        "email": "friend1@example.com"
      }
  auth: inherit

runtime:
  variables:
    - name: close_group_id
      value: 8786fe5e-66f3-4b60-97ba-0c5325d7c7ad

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Error - Missing Email
    request:
      url: "{{base_url}}api/v1/close-group/{{close_group_id}}/members"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, POST, HEAD, OPTIONS
        - name: content-length
          value: "246"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "VALIDATION_ERROR",
              "message": "There was a validation error with your request.",
              "details": [
                {
                  "type": "field",
                  "field": "email",
                  "issue": null,
                  "message": "This field is required."
                }
              ]
            },
            "meta": null
          }
  - name: Error - Cannot Add Yourself
    request:
      url: "{{base_url}}api/v1/close-group/{{close_group_id}}/members"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "admin@samsr.us"
          }
