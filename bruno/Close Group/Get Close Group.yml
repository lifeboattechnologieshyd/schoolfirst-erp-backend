info:
  name: Get Close Group
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}api/v1/close-group/{{close_group_id}}"
  auth: inherit

runtime:
  variables:
    - name: close_group_id
      value: 2c5a3baf-e30e-4a66-aed3-9f7fbdaeaa92

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success Response
    request:
      url: "{{base_url}}api/v1/close-group/{{close_group_id}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": {
              "id": "{{close_group_id}}",
              "name": "Default",
              "member_count": 3
            },
            "error": null,
            "meta": null
          }
  - name: Not Found (not owner)
    request:
      url: "{{base_url}}api/v1/close-group/{{close_group_id}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": null,
            "data": null,
            "error": {
              "code": "NOT_FOUND",
              "message": "Not found.",
              "details": []
            },
            "meta": null
          }

docs: |-
  Retrieve a single close group by ID.
  Only returns the group if the requesting user is the owner.
  Returns 404 if the group does not exist or is not owned by the caller.
