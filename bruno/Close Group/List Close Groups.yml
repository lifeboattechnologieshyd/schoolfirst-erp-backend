info:
  name: List Close Groups
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}api/v1/close-group"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success Response
    request:
      url: "{{base_url}}api/v1/close-group"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": [
              {
                "id": "{{close_group_id}}",
                "name": "Default",
                "member_count": 3
              }
            ],
            "error": null,
            "meta": {
              "count": 1,
              "next": null,
              "previous": null
            }
          }

docs: |-
  List all close groups owned by the requesting user.
  Auto-creates a "Default" close group if the user has none yet.
  Returns id, name, and member_count for each group.
