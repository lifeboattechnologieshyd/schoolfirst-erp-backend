info:
  name: Update Task Status
  type: http
  seq: 13

http:
  method: PUT
  url: "{{base_url}}api/v1/calendar/tasks/{{task_id}}/status"
  body:
    type: json
    data: |-
      {
        "status": "done"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Mark Task Done (creator — auto-hidden)
    request:
      url: "{{base_url}}api/v1/calendar/tasks/{{task_id}}/status"
      method: PUT
      body:
        type: json
        data: |-
          {
            "status": "done"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Task status updated.",
            "data": {
              "task_id": "6a0a4a78-e93c-4878-a14e-aeb20ba25902",
              "status": "done",
              "completed_at": "2026-10-20T08:30:00Z",
              "done_by": "{{user_id}}",
              "is_visible": false
            },
            "error": null,
            "meta": null
          }
  - name: Mark Task Done (family/group member — stays visible)
    request:
      url: "{{base_url}}api/v1/calendar/tasks/{{task_id}}/status"
      method: PUT
      body:
        type: json
        data: |-
          {
            "status": "done"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Task status updated.",
            "data": {
              "task_id": "6a0a4a78-e93c-4878-a14e-aeb20ba25902",
              "status": "done",
              "completed_at": "2026-10-20T08:30:00Z",
              "done_by": "{{family_member_user_id}}",
              "is_visible": true
            },
            "error": null,
            "meta": null
          }
  - name: Revert Task To Pending
    request:
      url: "{{base_url}}api/v1/calendar/tasks/{{task_id}}/status"
      method: PUT
      body:
        type: json
        data: |-
          {
            "status": "pending"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Task status updated.",
            "data": {
              "task_id": "6a0a4a78-e93c-4878-a14e-aeb20ba25902",
              "status": "pending",
              "completed_at": null,
              "done_by": null,
              "is_visible": true
            },
            "error": null,
            "meta": null
          }

docs: |-
  Update task status via PUT on the dedicated status endpoint.
  status: pending | done
  Any user with access to the task may update the status field.

  is_visible behaviour:
    - Creator marks done  → is_visible=false (task hidden from calendar immediately)
    - Non-creator marks done → is_visible=true (task stays visible; creator can accept/reject via PUT /tasks/<id>/status/acknowledge)
    - Anyone marks pending → is_visible=true

  done_by stores who moved the task to done and is cleared when status returns to pending.
  completed_at is set automatically when status=done and cleared when status=pending.
