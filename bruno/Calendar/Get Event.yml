info:
  name: Get Event
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}api/v1/calendar/events/{{event_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success Response
    request:
      url: "{{base_url}}api/v1/calendar/events/{{event_id}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": {
              "id": "b67c3a9e-7e03-4e85-b264-9fb51491e435",
              "creator_id": "{{user_id}}",
              "title": "Weekly Family Dinner",
              "description": "Bring dessert",
              "event_type": "family_time",
              "access_type": "group",
              "access_family_ids": [
                "{{family_id}}"
              ],
              "access_close_group": false,
              "access_user_ids": [],
              "start_at": "2026-10-19T18:00:00Z",
              "end_at": "2026-10-19T20:00:00Z",
              "all_day": false,
              "reminder_datetime": null,
              "reminder_types": null,
              "location": null,
              "attachments": [
                "events/b67c3a9e-7e03-4e85-b264-9fb51491e435/menu.pdf"
              ],
              "rrule": {
                "frequency": "weekly",
                "interval": 1,
                "by_day": [
                  "MO"
                ],
                "until": "2026-12-31"
              },
              "parent_event_id": null,
              "occurrence_date": null,
              "recurrence_end_date": "2026-12-31",
              "comment_count": 2,
              "is_deleted_instance": false,
              "created_at": "2026-05-12T02:29:58.494511Z",
              "updated_at": "2026-05-12T02:29:58.494523Z",
              "comments": [
                {
                  "id": "300b0b4c-2eb1-4024-97e0-04d95bc32fd0",
