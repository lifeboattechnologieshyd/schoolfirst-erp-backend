info:
  name: List Comments on Event
  type: http
  seq: 16

http:
  method: GET
  url: "{{base_url}}api/v1/calendar/events/{{event_id}}/comments"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: List Comments For One Occurrence
    request:
      url: "{{base_url}}api/v1/calendar/events/{{event_id}}/comments?occurrence_date=2026-10-19"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": [
              {
                "id": "300b0b4c-2eb1-4024-97e0-04d95bc32fd0",
                "parent_type": "event",
                "parent_id": "0f2b6c5d-8f5f-47d5-b7fd-c98e4c1b1111",
                "user_id": "{{user_id}}",
                "comment": "Can't wait!",
                "created_at": "2026-05-12T03:15:58.816048Z",
                "deleted_at": null
              }
            ],
            "error": null,
            "meta": null
          }

docs: |-
  List non-deleted comments for an event.
  Add ?occurrence_date=YYYY-MM-DD to inspect comments on a specific recurring occurrence override.
