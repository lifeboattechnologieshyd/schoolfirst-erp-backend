info:
  name: Create Event
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}api/v1/calendar/events"
  body:
    type: json
    data: |-
      {
        "title": "Weekly Family Dinner",
        "start_at": "2026-05-20T19:00:00Z",
        "end_at": null,
        "all_day": false,
        "description": "Every weekday, evening dinner together",
        "event_type": "family_dinner",
        "access_type": "mixed", //only_me, mixed, all
        "access_family_ids": ["{{family_id}}"],
        "access_close_group_ids": ["{{close_group_id}}"],
        "access_user_ids": [],
        "reminder_datetime": "2026-06-01T17:00:00Z",
        "reminder_types": ["push"],
        "location": {
          "name": "Home",
          "address": "123 Main St",
          "lat": 17.4126,
          "lng": 78.4071,
          "place_id": "ChIJxxx",
          "maps_url": "https://maps.google.com/?q=..."
        },
        "attachments": [
      //     "temp/b7dce1c0-5847-4a11-bd3e-fd094eeedc49/README_5bf6d70b.md"
        ],
        "rrule": {
          "frequency": "daily",
          "interval": 1,
          "by_day": ["MO","TU","WE","TH","FR"],
          "until": "2026-05-31"
        }
      }
  auth: inherit

runtime:
  variables:
    - name: close_group_id
      value: 2c5a3baf-e30e-4a66-aed3-9f7fbdaeaa92
  scripts:
    - type: after-response
      code: |-
        try {
          let response = res.getBody();
          if (response && response.success === true) {
            bru.setEnvVar("event_id", response.data.id);
          }
        } catch (e) {
          console.error("Error:", e);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

