docs: |-
  Create a new event. Required: title, start_at (timezone-aware ISO 8601).
  end_at is optional and may be null. If provided, it must be greater than or equal to start_at.
  For recurring events, end_at defines the duration of the anchor occurrence; generated occurrences keep the same duration, including overnight spans.
  access_type: only_me | all | mixed
  For all access, no ID arrays required. For mixed access, at least one ID in any access array is required.
  For mixed access, access_close_group_ids must be close groups owned by the creator. access_user_ids must be reachable via the creator's families or close groups.
  interval controls how many frequency units to skip between occurrences.
    Example: frequency=weekly with interval=2 means every 2 weeks.
  attachments: list of temp file paths returned by POST /api/v1/upload.
    Valid temp files are moved into the events/ directory on create. Unknown or invalid paths return 400.
  event_type is a free-form string.
  Recurring series return recurrence_end_date from rrule.until in responses.
  Validation errors use the standard details array: [{type, field, issue, message}].
