info:
  name: Unified Calendar View
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}api/v1/calendar?from_date=2026-05-01&to_date=2026-05-31"
  params:
    - name: from_date
      value: 2026-05-01
      type: query
    - name: to_date
      value: 2026-05-31
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success Response
    request:
      url: "{{base_url}}api/v1/calendar?from_date=2026-10-01&to_date=2026-10-31"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Calendar loaded.",
            "data": {
              "from_date": "2026-10-01",
              "to_date": "2026-10-31",
              "events": [
                {
                  "id": "0f2b6c5d-8f5f-47d5-b7fd-c98e4c1b1111",
                  "title": "Weekly Standup",
                  "event_type": "team_sync",
                  "start_at": "2026-10-05T10:00:00Z",
                  "end_at": "2026-10-05T10:30:00Z",
                  "all_day": false,
                  "rrule": {
                    "until": "2026-11-30",
                    "by_day": ["MO"],
                    "interval": 1,
                    "frequency": "weekly"
                  },
                  "recurrence_end_date": "2026-11-30"
                }
              ],
              "tasks": [
                {
                  "id": "4cd93f56-0b72-41c4-9d09-6c1d6a552222",
                  "title": "Weekly bill payment",
                  "task_type": "bill_payment",
                  "status": "pending",
                  "priority": "high",
                  "deadline_datetime": "2026-10-09T17:00:00Z",
                  "rrule": null,
                  "recurrence_end_date": null
                }
              ],
              "general_events": []
            },
            "error": null,
            "meta": null
          }

docs: |-
  Unified calendar view for a date range via GET query params.
  Returns events, tasks, and general_events.
  events: user-created events (EventCalendarSummarySerializer, collapsed recurring series).
  general_events: cron-populated system events (title, description, event_at).
  tasks: pending tasks only — done tasks are excluded from this view.
  The endpoint is intentionally unpaginated.
  The requested date window must be 31 days or less.
  Validation errors use the standard details array: [{type, field, issue, message}].
