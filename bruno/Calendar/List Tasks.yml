docs: |-
  List tasks with filters: from_date, to_date, status, priority, creator_id, access_type, agent_assist, is_visible, task_type, sort, page, page_size.
  sort accepts one or more comma-separated field names with an optional "-" prefix for descending order.
  Example: sort=deadline_datetime (asc), sort=-deadline_datetime (desc), sort=priority,-deadline_datetime (multi-field).
  Allowed sort fields: deadline_datetime, completed_at, status, priority, created_at. Default: deadline_datetime.
  from_date and to_date can be supplied together for a recurrence-aware date window or independently as lower/upper date bounds.
  Returned items are ordered by deadline_datetime ascending by default, so earlier deadlines come first.
  List items mirror the detail payload except they omit the inline comments array.
  comment_count is included for each returned task item.
  Recurring tasks collapse to one parent row when at least one visible occurrence overlaps the requested from_date/to_date window.
  Validation errors use the standard details array: [{type, field, issue, message}].
