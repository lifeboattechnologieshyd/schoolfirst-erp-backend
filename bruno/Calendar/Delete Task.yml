info:
  name: Delete Task
  type: http
  seq: 12

http:
  method: DELETE
  url: "{{base_url}}api/v1/calendar/tasks/{{task_id}}"
  params:
    - name: scope
      value: this
      type: query
      enabled: false
    - name: occurrence_date
      value: 2026-10-23
      type: query
      enabled: false
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Delete Whole Series
    request:
      url: "{{base_url}}api/v1/calendar/tasks/{{task_id}}"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": {
              "deleted": true
            },
            "error": null,
            "meta": null
          }
  - name: Delete One Occurrence
    request:
      url: "{{base_url}}api/v1/calendar/tasks/{{task_id}}?scope=this&occurrence_date=2026-10-23"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": {
              "deleted": true
            },
            "error": null,
            "meta": null
          }
  - name: Delete This and Future
    request:
      url: "{{base_url}}api/v1/calendar/tasks/{{task_id}}?scope=this_and_future&occurrence_date=2026-10-30"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": {
              "deleted": true
            },
            "error": null,
            "meta": null
          }

docs: |-
  Delete a task (creator only).
  Query params:
  - scope: "all" (default) | "this" | "this_and_future"
  - occurrence_date=YYYY-MM-DD is required when scope is "this" or "this_and_future"

  Scope behaviour:
  - all: deletes the entire series including all child overrides.
  - this: tombstones the single occurrence at occurrence_date; the parent series and all other occurrences remain.
  - this_and_future: truncates the parent series' RRULE until to occurrence_date minus 1 day; all occurrences from occurrence_date onwards are removed.

  Omitting occurrence_date when scope is "this" or "this_and_future" returns 400 with field error on occurrence_date.
