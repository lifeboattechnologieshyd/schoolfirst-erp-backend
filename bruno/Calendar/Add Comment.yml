info:
  name: Add Comment to Event
  type: http
  seq: 15

http:
  method: POST
  url: "{{base_url}}api/v1/calendar/events/{{event_id}}/comments"
  body:
    type: json
    data: |-
      {
        "comment": "Can't wait!",
        "occurrence_date": "2026-10-19"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        try {
          let response = res.getBody();
          if (response && response.success === true) {
            bru.setEnvVar("comment_id", response.data.id);
          }
        } catch (e) {
          console.error("Error:", e);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Comment On A Recurring Occurrence
    request:
      url: "{{base_url}}api/v1/calendar/events/{{event_id}}/comments"
      method: POST
      body:
        type: json
        data: |-
          {
            "comment": "Can't wait!",
            "occurrence_date": "2026-10-19"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": {
              "id": "300b0b4c-2eb1-4024-97e0-04d95bc32fd0",
              "parent_type": "event",
              "parent_id": "0f2b6c5d-8f5f-47d5-b7fd-c98e4c1b1111",
              "user_id": "{{user_id}}",
              "comment": "Can't wait!",
              "created_at": "2026-05-12T03:15:58.816048Z",
              "deleted_at": null
            },
            "error": null,
            "meta": null
          }

docs: |-
  Add a comment to an event.
  comment is required.
  occurrence_date is optional and targets a specific recurring occurrence. When provided, the backend creates or reuses the matching override row and stores the comment there.
