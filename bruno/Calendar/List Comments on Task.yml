info:
  name: List Comments on Task
  type: http
  seq: 19

http:
  method: GET
  url: "{{base_url}}api/v1/calendar/tasks/{{task_id}}/comments"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: List Comments For One Occurrence
    request:
      url: "{{base_url}}api/v1/calendar/tasks/{{task_id}}/comments?occurrence_date=2026-10-23"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": [
              {
                "id": "13b808f2-73b9-4af6-a94f-f12f77f9a8f1",
                "parent_type": "task",
                "parent_id": "4cd93f56-0b72-41c4-9d09-6c1d6a552222",
                "user_id": "{{user_id}}",
                "comment": "I'll handle this one.",
                "created_at": "2026-05-12T03:15:59.236464Z",
                "deleted_at": null
              }
            ],
            "error": null,
            "meta": null
          }

docs: |-
  List non-deleted comments for a task.
  Add ?occurrence_date=YYYY-MM-DD to inspect comments on a specific recurring occurrence override.
