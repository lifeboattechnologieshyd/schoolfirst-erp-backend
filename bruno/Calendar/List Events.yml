  - name: Daily Recurrence Window Example
    request:
      url: "{{base_url}}api/v1/calendar/events?from_date=2026-05-01&to_date=2026-05-30&creator_id={{user_id}}&page_size=100"
      method: GET

docs: |-
  List events with optional filters: from_date, to_date, event_type, creator_id, access_type, sort, page, page_size.
  sort accepts one or more comma-separated field names with an optional "-" prefix for descending order.
  Example: sort=start_at (asc), sort=-start_at (desc), sort=start_at,-created_at (multi-field).
  Allowed sort fields: start_at, created_at, updated_at. Default: start_at.
  from_date and to_date can be supplied together for a recurrence-aware date window or independently as lower/upper date bounds.
  Returned items are ordered by start_at ascending by default, so earlier event dates and times come first.
  List items mirror the detail payload except they omit the inline comments array.
  comment_count is included for each returned event item.
  When from_date and to_date are provided, recurring series collapse to one parent row when at least one visible occurrence overlaps the window.
  Example: an event created on 2026-04-05 with frequency=daily and until=2026-10-05 returns one parent row for a query from 2026-05-01 to 2026-05-30.
  Validation errors use the standard details array: [{type, field, issue, message}].
