docs: |-
  Create a new task. Only title is required.
  priority: routine (default) | medium | high | urgent
  status defaults to pending.
  task_type is a free-form string.
  If access_type is specific, access_user_ids must be non-empty and every user must be a joined family member of the creator or a joined member of the creator's close group.
  interval controls how many frequency units to skip between occurrences.
    Example: frequency=weekly with interval=2 means every 2 weeks.
  agent_assist defaults to false.
  attachments: list of temp file paths returned by POST /api/v1/upload.
    Valid temp files are moved into the tasks/ directory on create. Unknown or invalid paths return 400.
  Recurring series return recurrence_end_date from rrule.until in responses.
  Validation errors use the standard details array: [{type, field, issue, message}].
