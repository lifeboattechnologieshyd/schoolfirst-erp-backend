info:
  name: Create Task
  type: http
  seq: 8

http:
  method: POST
  url: "{{base_url}}api/v1/calendar/tasks"
  body:
    type: json
    data: |-
      {
        "title": "Book AC service",
        "description": "Annual maintenance",
        "task_type": "home_maintenance",
        "access_type": "mixed",
        "access_family_ids": ["{{family_id}}"],
        "access_close_group_ids": [],
        "access_user_ids": [],
        "priority": "medium",
        "agent_assist": false,
        "deadline_datetime": "2026-05-20T10:00:00Z",
        "reminder_datetime": "2026-05-19T09:00:00Z",
        "reminder_types": ["push"],
        "location": null,
        "attachments": [
      //     "temp/{{user_id}}/service_quote.txt"
        ],
        "rrule": null
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        try {
          let response = res.getBody();
          if (response && response.success === true) {
            bru.setEnvVar("task_id", response.data.id);
          }
        } catch (e) {
          console.error("Error:", e);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

