info:
  name: Update Task
  type: http
  seq: 11

http:
  method: PUT
  url: "{{base_url}}api/v1/calendar/tasks/{{task_id}}"
  body:
    type: json
    data: |-
      {
        "title": "Weekly bill payment (late reminder)",
        "reminder_datetime": "2026-10-23T12:00:00Z",
        "update_scope": "this",
        "occurrence_date": "2026-10-23"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Update One Occurrence
    request:
      url: "{{base_url}}api/v1/calendar/tasks/{{task_id}}"
      method: PUT
      body:
        type: json
        data: |-
          {
            "title": "Weekly bill payment (late reminder)",
            "reminder_datetime": "2026-10-23T12:00:00Z",
            "update_scope": "this",
            "occurrence_date": "2026-10-23"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
