docs: |-
  Update a task (creator only). Send only fields to change.
  update_scope: "all" | "this" | "this_and_future" (default: "all").
  occurrence_date (YYYY-MM-DD) is required when update_scope is "this" or "this_and_future".
  Only status is writable by any user with access. All other task fields remain creator-only.
  For mixed access, access_close_group_ids must be close groups owned by the creator. access_user_ids must be reachable via the creator's families or close groups.
  If attachments are sent, they must be valid temp file paths from POST /api/v1/upload.
  Validation errors use the standard details array: [{type, field, issue, message}].
