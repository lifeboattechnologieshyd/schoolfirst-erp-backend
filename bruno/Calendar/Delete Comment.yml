info:
  name: Delete Comment
  type: http
  seq: 18

http:
  method: DELETE
  url: "{{base_url}}api/v1/calendar/comments/{{comment_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success Response
    request:
      url: "{{base_url}}api/v1/calendar/comments/{{comment_id}}"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: DELETE, OPTIONS
        - name: content-length
          value: "80"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": {
              "deleted": true
            },
            "error": null,
            "meta": null
          }

docs: |-
  Soft-delete a comment. Only the comment author can delete it (403 otherwise).
  The comment row is kept but marked with deleted_at timestamp.
