info:
  name: Delete Thread
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{base_url}}api/v1/assistant/threads/{{thread_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Delete a thread and all its messages permanently.

examples:
  - name: Success Response
    request:
      url: "{{base_url}}api/v1/assistant/threads/{{thread_id}}"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, PUT, PATCH, DELETE, HEAD, OPTIONS
        - name: content-length
          value: 68
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": null,
            "error": null,
            "meta": null
          }
