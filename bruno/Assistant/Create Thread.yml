info:
  name: Create Thread
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}api/v1/assistant/threads"
  body:
    type: json
    data: |-
      {
        "name": "New Chat"
      //   "module_settings": {
      //     "module_name": "docusafe",
      //     "docusafe_file_ids": [
      //       "7c14b9a0-0cec-4f78-9950-de37c8ace103",
      //       "a23c8e43-be49-44ca-9d00-6917d6eeec60"
      //     ]
      //   }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        try {
            let response = res.getBody();

            // Check if token is expired
            if (response && response.success === true) {
              console.log("Updating Thread ID Variable");
              var thread_id = response.data.id;
              bru.setEnvVar("thread_id", thread_id);
            }
        } catch (e) {
            console.error("❌ Error in collection-level post-request script:", e);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Create a new chat thread.

  **Note:** The 'name' field is optional. If not provided, the thread will be created with the default name 'New Chat', which will be automatically updated to a descriptive title when the first message is sent (generated from the message content using AI).

  You can:
  - Omit the 'name' field entirely (sends `{}`)
  - Provide a custom name (e.g., `{"name": "My Custom Thread"}`)

examples:
