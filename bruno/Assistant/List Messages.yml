info:
  name: List Messages
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}api/v1/assistant/threads/{{thread_id}}/messages"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  List all messages in a thread.

  Response includes message `content_blocks` with typed blocks.
  Tool execution data is stored in content blocks using:
    - type
    - tool_call_id
    - tool_name
    - request (tool call start payload)
    - response (completed tool output payload)

examples:
  - name: Success Response
    request:
      url: "{{base_url}}api/v1/assistant/threads/{{thread_id}}/messages"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: allow
          value: GET, HEAD, OPTIONS
        - name: content-length
          value: 112
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: vary
          value: origin
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": null,
            "data": [],
            "error": null,
            "meta": {
              "total": 0,
              "page": 0,
              "page_size": 0,
              "total_pages": 0
            }
          }
