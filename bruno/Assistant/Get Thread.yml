info:
  name: Get Thread
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}api/v1/assistant/threads/{{thread_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Retrieve details of a specific thread by ID.

examples:
