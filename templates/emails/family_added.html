<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Family Invitation</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px;">
        <h2 style="color: #4CAF50;">You've been added to a family!</h2>
        <p>Hi there,</p>
        <p><strong>{{ inviter_name }}</strong> has added you to their family <strong>{{ family_name }}</strong> on SamsR.</p>
        <p>Log in to your SamsR account to accept the invitation and start sharing with your family.</p>
        <p>Best regards,<br>The SamsR Team</p>
    </div>
</body>
</html>
